# ----------------------------------------------------------------------------
# Ploi-Vhost-Vorlage: statisches Astro-Frontend (MPA) und Hono-API auf Bun.
# Inhalt nach dem Ersetzen der Platzhalter 1:1 in Ploi unter
# Site -> Manage -> Edit Nginx Configuration übernehmen, dann nginx -t + Reload.
#
# Platzhalter:
#   __DOMAIN__          Hostname der Site (z. B. example.at)
#   __SITE_DIRECTORY__  Site-Verzeichnis (z. B. /home/ploi/example.at)
#   __PORT__            Backend-Port aus der .env (PORT)
#   __MAPPREFIX__       Kurzname ohne Punkte (z. B. example). Map-Variablen sind
#                       serverweit sichtbar; auf dem geteilten Ploi-Server
#                       überschreibt sonst die zuletzt geladene Site alle anderen.
#
# Ploi-Site-Einstellung "Web directory" muss /apps/frontend/dist sein (Certbot
# nutzt diesen Pfad). Die include-Zeilen von Ploi nicht entfernen: Ploi
# verwaltet SSL, Redirects und ACME darüber. Die ssl_*-Zeilen entsprechen dem
# von Ploi erzeugten Vhost und werden beim Zusammenführen gegen den aktuellen
# Stand abgeglichen.
#
# MERKSATZ: In diesem Vhost steht KEIN add_header innerhalb einer location.
# Nginx vererbt add_header aus server{} nur in Locations ohne eigenes
# add_header; ein Cache-Control in einer .html-Location würde HSTS,
# X-Frame-Options und Co. ausgerechnet auf den HTML-Dokumenten entfernen.
# Wer einen Header braucht, löst ihn über die Maps unten.
# ----------------------------------------------------------------------------

# HTML nie cachen: nach einem Deploy zeigt eine gecachte Seite sonst auf
# gelöschte Asset-Hashes (weiße Seite bis zum harten Reload).
map $sent_http_content_type $__MAPPREFIX___html_cache {
    ~*^text/html "no-store, no-cache, must-revalidate";
    default "";
}
# Content-gehashte Astro-Assets dürfen ein Jahr unverändert im Cache bleiben.
map $uri $__MAPPREFIX___cache_control {
    ~^/_astro/ "public, max-age=31536000, immutable";
    default $__MAPPREFIX___html_cache;
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/__DOMAIN__/before/*;
server {
    #listen 80;
    #listen [::]:80;
    server_name __DOMAIN__;
    include /etc/nginx/ssl/__DOMAIN__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Bewusst kein X-XSS-Protection (veraltet, in modernen Browsern entfernt).
    # HSTS: includeSubDomains verpflichtet jede Subdomain auf HTTPS. preload nur
    # nach bewusster Entscheidung (öffentliche Browserliste, kaum rücknehmbar):
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $__MAPPREFIX___cache_control always;
    charset utf-8;

    # gzip ist auf dem Ploi-Server nicht global aktiv. Kein font/woff2: WOFF2 ist
    # bereits komprimiert. Brotli nur nach Nachweis des Moduls (nginx -V), sonst
    # bricht nginx -t für alle Sites des Servers.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml application/manifest+json image/svg+xml font/ttf font/otf;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/__DOMAIN__/server/*;

    root __SITE_DIRECTORY__/apps/frontend/dist;
    index index.html;
    access_log off;
    error_log /var/log/nginx/__DOMAIN__-error.log error;
    # Formulare senden kleines JSON. Größere Limits nur je Upload-Route:
    #   location = /api/<upload> { client_max_body_size 20m; proxy_pass ...; }
    client_max_body_size 1M;

    location = /favicon.ico { log_not_found off; }
    location = /robots.txt { log_not_found off; }

    # Vor allen Regex-Locations: sonst könnte /.geheim.html als HTML matchen.
    location ~ /\.(?!well-known).* { deny all; }

    # X-Forwarded-For wird überschrieben, nicht angehängt: hinter genau einem
    # Proxy ist $remote_addr die einzige vertrauenswürdige Adresse
    # (TRUSTED_PROXY_HOPS=1). Ein vom Client mitgeschickter Header kann so
    # weder den Rate-Limiter noch Conversions verfälschen.
    location = /health {
        proxy_pass http://127.0.0.1:__PORT__/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Hono verwendet für seine API-Startseite den exakten Pfad ohne Slash.
    location = /api {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ^~ hält auch API-Pfade mit .js/.json beim Backend (z. B. Pixel-Proxy).
    # Kein Upgrade/Connection-Header: die API kennt keine WebSockets. Eine
    # Keepalive-Verbindung zum Backend entsteht dadurch NICHT — dafuer
    # braeuchte es einen upstream-Block mit keepalive und zusaetzlich
    # proxy_set_header Connection "". Ueber Loopback ist der Verbindungsaufbau
    # billig genug, dass sich das bisher nicht lohnt.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cache-Control für /_astro/ kommt aus der Map (immutable).
    location ^~ /_astro/ {
        try_files $uri =404;
    }
    # Nginx kennt die Endung .webmanifest bis heute nicht (mime.types 1.26). Ohne
    # den Typ geht das Manifest als application/octet-stream raus, und Chromium
    # verwirft es: verarbeitet werden nur application/manifest+json und
    # JSON-Typen. types{} in einer Location ersetzt die Typkarte nur dort - hier
    # liegt genau eine Datei. Kein add_header: die Header aus server{} bleiben
    # dadurch vererbt (siehe MERKSATZ oben).
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1h;
        try_files $uri =404;
    }
    # Ungehashte Dateien aus public/: kurz cachen, damit ein Austausch greift.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico|map|xml|txt|webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    # MPA-Fallback für Astro build.format "directory" mit trailingSlash "always"
    # oder "ignore": /seite -> 301 /seite/ -> seite/index.html.
    # Bei trailingSlash "never" stattdessen: try_files $uri/index.html $uri =404;
    location / {
        try_files $uri $uri/ =404;
    }

    # Echte 404-Seite aus dem Build mit Status 404 (kein Soft-404).
    error_page 404 /404.html;
    location = /404.html { internal; }
}
# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/__DOMAIN__/after/*;
