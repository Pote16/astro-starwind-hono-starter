# Ploi-Vorlage für statisches Astro und eine Hono-API.
# __DOMAIN__ und __SITE_DIRECTORY__ durch die tatsächlichen Site-Werte ersetzen.
# PORT der Backend-.env mit den beiden Proxy-Zielen (Standard 3005) abgleichen.
# Mit dem Ploi-generierten Vhost zusammenführen: dessen Listen-/SSL-/ACME-Includes
# bleiben maßgeblich. Erst nginx -t, dann Reload. Diese Datei aktiviert nichts.

map $sent_http_content_type $starter_cache_control {
    ~*^text/html "no-store, no-cache, must-revalidate";
    default "";
}

# Ploi Configuration, do not remove!
include /etc/nginx/ploi/__DOMAIN__/before/*;
server {
    #listen 80;
    #listen [::]:80;
    server_name __DOMAIN__;
    include /etc/nginx/ssl/__DOMAIN__;
    include /etc/nginx/ploi/__DOMAIN__/server/*;

    root __SITE_DIRECTORY__/apps/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 1M;
    access_log off;
    error_log /var/log/nginx/__DOMAIN__-error.log error;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nur für einen fertig eingerichteten HTTPS-Host übernehmen. Keine pauschale
    # Verpflichtung unbekannter Subdomains und kein automatischer Preload-Antrag.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $starter_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location ~ /\.(?!well-known).* { deny all; }

    location = /health {
        proxy_pass http://127.0.0.1:3005/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Hono verwendet für seine API-Startseite den exakten Pfad ohne Slash.
    location = /api {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ^~ hält auch API-Pfade mit .js/.json beim Backend; kein SPA-Fallback.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Content-Hashes dürfen lange im Cache bleiben. Keine eigenen add_header
    # in Locations setzen, sonst entfällt die Vererbung der Security-Header.
    location ^~ /_astro/ {
        expires 1y;
        try_files $uri =404;
    }
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1h;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
# Ploi Configuration, do not remove!
include /etc/nginx/ploi/__DOMAIN__/after/*;
